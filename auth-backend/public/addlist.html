<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Property Listing</title>
    <link rel="stylesheet" href="./assets/css/add.css">
</head>
<body>
    <div class="container">
        <h1>Add Property Listing</h1>
        <form id="addListingForm" enctype="multipart/form-data">

            <label for="title">Property Title:</label>
            <input type="text" id="title" name="title" placeholder="Enter property title" required>

            <label for="description">Description:</label>
            <textarea id="description" name="description" rows="4" placeholder="Enter property description" required></textarea>

            <label for="type">Property Type:</label>
            <select id="type" name="type" required>
                <option value="" disabled selected>Select Type</option>
                <option value="house">House</option>
                <option value="apartment">Apartment</option>
                <option value="commercial">Commercial Space</option>
            </select>

            <label for="location">Location:</label>
            <input type="text" id="location" name="location" placeholder="Enter address or location" required>

            <label for="price">Price:</label>
            <input type="number" id="price" name="price" placeholder="Enter price in USD" required>

            <label for="bedrooms">Bedrooms:</label>
            <input type="number" id="bedrooms" name="bedrooms" min="0" placeholder="Number of bedrooms">

            <label for="bathrooms">Bathrooms:</label>
            <input type="number" id="bathrooms" name="bathrooms" min="0" placeholder="Number of bathrooms">

            <label for="images">Upload Images:</label>
            <input type="file" id="images" name="images" multiple accept="image/*">

            <label for="contact">Contact Information:</label>
            <input type="text" id="contact" name="contact" placeholder="Enter your contact details" required>

            <button type="submit">Submit Listing</button>
        </form>
    </div>

   <script>
  const form = document.getElementById("addListingForm");
  const submitBtn = form.querySelector("button[type='submit']");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    submitBtn.innerText = "Submitting...";
    submitBtn.disabled = true;

    const title = document.getElementById("title").value.trim();
    const description = document.getElementById("description").value.trim();
    const type = document.getElementById("type").value;
    const location = document.getElementById("location").value.trim();
    const price = document.getElementById("price").value.trim();
    const bedrooms = document.getElementById("bedrooms").value.trim();
    const bathrooms = document.getElementById("bathrooms").value.trim();
    const contact = document.getElementById("contact").value.trim();

    try {
      const res = await fetch("/listings", {
        method: "POST",
        credentials: "include",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          title: title,
          description: description,
          type: type,
          city: location,      // location -> city column
          price: price,
          bhk: bedrooms,       // bedrooms -> bhk column
          bathrooms: bathrooms,
          contact: contact,
        }),
      });

      let data = {};
      try {
        data = await res.json();
      } catch (e) {
        console.error("JSON parse error, maybe HTML/404 aa raha hai:", e);
      }

      console.log("LISTING RESPONSE:", res.status, data);

      if (!res.ok) {
        // server se jo message aya use show karo
        alert(data.message || "Server error while saving listing");
        submitBtn.innerText = "Error! Try Again";
        submitBtn.style.background = "#e63946";
        submitBtn.disabled = false;
        return;
      }

      // ✅ SUCCESS
      form.reset();
      submitBtn.innerText = "✔ DONE";
      submitBtn.style.background = "#28a745";
      submitBtn.disabled = true;

    } catch (err) {
      console.error("Request error:", err);
      alert("Network / CORS error: see console.");
      submitBtn.innerText = "Error! Try Again";
      submitBtn.style.background = "#e63946";
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
